# This profile is loaded after corne.conf for corne_dongle builds only
CONFIG_ZMK_KEYBOARD_NAME="Corne Silver RX"

# Keep the stock ZMK endpoint selection, with USB and Bluetooth both available
CONFIG_ZMK_USB=y
CONFIG_ZMK_BLE=y

# A central without physical keys must not enter deep sleep
CONFIG_ZMK_SLEEP=n
CONFIG_ZMK_PM_SOFT_OFF=n
CONFIG_ZMK_EXT_POWER=n

CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n
CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# Do not sample an unconfirmed battery circuit. Peripheral BAS works independently.
CONFIG_ZMK_BATTERY_REPORTING=n
CONFIG_CORNE_DONGLE_BATTERY_CONFIRMED=n
