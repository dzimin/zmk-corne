name: Screen logic
on: [push, pull_request, workflow_dispatch]
jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test power policy, history and framebuffer with sanitizers
        run: python3 tests/run_screen_tests.py --preview /tmp/dongle-screen.png
      - uses: actions/upload-artifact@v4
        with:
          name: screen-preview
          path: /tmp/dongle-screen.png
